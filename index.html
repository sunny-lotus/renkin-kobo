<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ノルンの錬金工房</title>
<style>
  :root {
    --sky-top: #1b2a4a;
    --sky-bottom: #4a6fa5;
    --ring: rgba(255, 244, 214, 0.55);
    --ink: #fdf8ec;
    --soft: #d9e3f2;
    --card: rgba(20, 28, 48, 0.55);
    --accent: #f2c66d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }
  .rings {
    position: fixed; inset: 0; pointer-events: none;
  }
  .rings svg { width: 100%; height: 100%; }
  main {
    position: relative;
    max-width: 520px;
    width: 100%;
    text-align: center;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 18px;
    padding: 40px 24px 32px;
    backdrop-filter: blur(4px);
  }
  .flask { font-size: 56px; line-height: 1; }
  h1 {
    margin: 16px 0 8px;
    font-size: clamp(26px, 7vw, 36px);
    letter-spacing: 0.08em;
  }
  .sub { color: var(--soft); margin: 0 0 28px; font-size: 15px; }
  .badge {
    display: inline-block;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    padding: 6px 18px;
    font-size: 15px;
    letter-spacing: 0.15em;
  }
  p.note { color: var(--soft); font-size: 14px; line-height: 1.8; margin: 24px 0 0; }
</style>
</head>
<body>
  <div class="rings" aria-hidden="true">
    <svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
      <g fill="none" stroke="var(--ring)">
        <path d="M-100 210 Q500 40 1100 170" stroke-width="2"/>
        <path d="M-100 228 Q500 62 1100 190" stroke-width="1"/>
        <path d="M-100 244 Q500 82 1100 208" stroke-width="1.5" opacity="0.7"/>
        <path d="M-100 262 Q500 104 1100 228" stroke-width="0.8" opacity="0.5"/>
      </g>
    </svg>
  </div>
  <main>
    <div class="flask" aria-hidden="true">⚗️</div>
    <h1>ノルンの錬金工房</h1>
    <p class="sub">シュテルネンリングの世界の、小さな工房のおはなし</p>
    <span class="badge">準備中</span>
    <p class="note">素材を集めて、調合して、お店で売る。<br>見習い錬金術師の30日を、いま作っています。</p>
  </main>
</body>
</html>
